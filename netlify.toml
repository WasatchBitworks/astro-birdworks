[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Pin Ruby/Python/Go to the versions preinstalled in Netlify's Noble image.
  # Unpinned, mise compiles newer defaults on every build (~3.5 min of dead
  # time before our 7s build). None of these are used by the site.
  RUBY_VERSION = "3.3.6"
  PYTHON_VERSION = "3.13"
  GO_VERSION = "1.23"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The old Eleventy site served /sitemap.xml; @astrojs/sitemap emits an index
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
