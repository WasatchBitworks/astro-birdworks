[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's Noble image provisions Ruby/Python/Go via mise on every build
  # even though this site uses none of them. Pinning keeps those installs
  # cached and logged (seconds each) and avoids a from-source Ruby compile.
  # NOTE (Sep 9, 2026): there is still a ~3.5 min unlogged gap between
  # "Starting build script" and the Netlify Build banner that is NOT any of
  # these runtimes, deps, or plugins (all ruled out). Netlify-side; ticket filed.
  MISE_RUBY_COMPILE = "false"
  RUBY_VERSION = "3.4.8"
  PYTHON_VERSION = "3.13"
  GO_VERSION = "1.23"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The old Eleventy site served /sitemap.xml; @astrojs/sitemap emits an index
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
