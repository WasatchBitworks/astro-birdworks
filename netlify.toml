[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's Noble image provisions Ruby/Python/Go via mise on every build
  # even though this site uses none of them. Ruby defaults to compiling from
  # source (~3.5 min of "make" before our 7s astro build). This flips mise to
  # a precompiled Ruby download (seconds), same as Python already does.
  MISE_RUBY_COMPILE = "false"
  PYTHON_VERSION = "3.13"
  GO_VERSION = "1.23"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The old Eleventy site served /sitemap.xml; @astrojs/sitemap emits an index
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
